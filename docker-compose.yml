x-database-url: &database-url postgresql://toktickit:local-only@db:5432/toktickit

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: toktickit
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: *database-url
      PORT: 4000
      APP_ORIGIN: http://localhost:4000
      NODE_ENV: development
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
